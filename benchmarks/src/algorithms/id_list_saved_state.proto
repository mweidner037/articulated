syntax = "proto3";

// Format 8: Transposed, with signed counts and bunchIds extracted into a single array.
// (Repeated scalars are packed by default in proto3.)
message BunchIndexSavedIdListMessage {
  repeated string bunchIds = 1;
  repeated uint32 bunchIndices = 2;
  repeated uint32 startCounters = 3;
  // Negative count means deleted.
  repeated sint32 counts = 4;
}

// Format 9: Transposed, with signed counts and clientIds extracted into a single array.
// (Repeated scalars are packed by default in proto3.)
message ClientIndexSavedIdListMessage {
  repeated string clientIds = 1;
  repeated uint32 clientIndices = 2;
  repeated uint32 seqNums = 3;
  repeated uint32 startCounters = 4;
  // Negative count means deleted.
  repeated sint32 counts = 5;
}
