syntax = "proto3";

// Transposed: SavedIdList transposed, with signed counts.
// (Repeated scalars are packed by default in proto3.)
message TransposedSavedIdListMessage {
  repeated string bunchIds = 1;
  repeated uint32 startCounters = 2;
  // Negative count means deleted.
  repeated sint32 counts = 3;
}

// SplitTransposed: TransposedSavedIdListMessage, but with bunchIds split into
// clientId and seqNum.
message SplitTransposedSavedIdListMessage {
  repeated string clientIds = 1;
  repeated uint32 seqNums = 2;
  repeated uint32 startCounters = 3;
  // Negative count means deleted.
  repeated sint32 counts = 4;
}

// BunchIndex: Transposed, with signed counts and bunchIds extracted into a single array.
// (Repeated scalars are packed by default in proto3.)
message BunchIndexSavedIdListMessage {
  repeated string bunchIds = 1;
  repeated uint32 bunchIndices = 2;
  repeated uint32 startCounters = 3;
  // Negative count means deleted.
  repeated sint32 counts = 4;
}

// ClientIndex: Transposed, with signed counts and clientIds extracted into a single array.
// (Repeated scalars are packed by default in proto3.)
message ClientIndexSavedIdListMessage {
  repeated string clientIds = 1;
  repeated uint32 clientIndices = 2;
  repeated uint32 seqNums = 3;
  repeated uint32 startCounters = 4;
  // Negative count means deleted.
  repeated sint32 counts = 5;
}

// BunchIndexOmit: BunchIndexSavedIdListMessage, but only including non-obvious
// startCounters. startCounterIndexes is delta-encoded.
message BunchIndexOmitSavedIdListMessage {
  repeated string bunchIds = 1;
  repeated uint32 bunchIndices = 2;
  repeated uint32 startCounterIndexes = 3;
  repeated uint32 startCounters = 4;
  // Negative count means deleted.
  repeated sint32 counts = 5;
}

// ClientIndexOmit: ClientIndexSavedIdListMessage, but only including non-obvious
// startCounters. startCounterIndexes is delta-encoded.
message ClientIndexOmitSavedIdListMessage {
  repeated string clientIds = 1;
  repeated uint32 clientIndices = 2;
  repeated uint32 seqNums = 3;
  repeated uint32 startCounterIndexes = 4;
  repeated uint32 startCounters = 5;
  // Negative count means deleted.
  repeated sint32 counts = 6;
}

// TransposedOmit: Transposed, with signed counts, but only including non-obvious
// startCounters. startCounterIndexes is delta-encoded.
message TransposedOmitSavedIdListMessage {
  repeated string bunchIds = 1;
  repeated uint32 startCounterIndexes = 2;
  repeated uint32 startCounters = 3;
  // Negative count means deleted.
  repeated sint32 counts = 4;
}

// SplitTransposedOmit: TransposedOmitSavedIdListMessage, but with bunchIds
// split into clientId and seqNum.
message SplitTransposedOmitSavedIdListMessage {
  repeated string clientIds = 1;
  repeated uint32 seqNums = 2;
  repeated uint32 startCounterIndexes = 3;
  repeated uint32 startCounters = 4;
  // Negative count means deleted.
  repeated sint32 counts = 5;
}
