<title id="title">Editing memory: four open documents</title><desc id="desc">Only one document edited. Sorted by memory after 2,000 distributed operations. Median of 3 trials after GC. Heap + backing storage; not RSS. Third panel is total, not extra memory.. Exact values are labeled on every bar.</desc>
