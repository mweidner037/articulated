<title id="title">Editing memory with 100 prior ID versions retained</title><desc id="desc">After 2,000 operations on one of four editors. Sorted by distributed-workload memory. Different editing trajectories, each retaining 100 versions. New bunches are sequences under one client.. Exact values are labeled on every bar.</desc>
